server {
    listen 8080;
    server_name _;
    root /var/www/beta-app/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8090;
    server_name _;
    root /var/www/internal-app/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}